[package]
name = "walltag"
version = "0.1.1"
edition = "2021"
description = "Minimalist wallpaper manager and visual gallery for Linux/Wayland"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dante-ferr/walltag"
homepage = "https://github.com/dante-ferr/walltag"
documentation = "https://github.com/dante-ferr/walltag#readme"
authors = ["Dante Ferreira <dante.tf5@gmail.com>"]
keywords = ["wallpaper", "wayland", "gtk", "gallery", "linux"]
categories = ["multimedia", "gui", "command-line-utilities"]
exclude = [
  "packaging/aur/src",
  "packaging/aur/pkg",
  "packaging/aur/*.pkg.tar.*",
  "packaging/flatpak/build-dir",
  "packaging/flatpak/.flatpak-builder",
  "packaging/flatpak/cargo-sources.json",
  "target-*/",
  ".github",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "5"
glib = "0.20"
gtk4 = { version = "0.9", features = ["v4_14"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
notify = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
