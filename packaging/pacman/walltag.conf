# Walltag binary repository (self-hosted, not the AUR).
# Install:
#   sudo install -Dm644 walltag.conf /etc/pacman.d/walltag
#   Then add this line under the other Include lines in /etc/pacman.conf:
#   Include = /etc/pacman.d/walltag
#
# Or append the block below directly to /etc/pacman.conf.

[walltag]
SigLevel = Optional TrustAll
Server = https://dante-ferr.github.io/walltag/$arch
