name: Pacman repo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to package (for example v0.1.1)
        required: true
        type: string

permissions:
  contents: write
  pages: write

concurrency:
  group: pacman-repo
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          case "$tag" in
            v*) ;;
            *) echo "Tag must look like vX.Y.Z (got: $tag)" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Build package in Arch container
        run: |
          set -euo pipefail
          mkdir -p pkgout
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$PWD/pkgout:/pkgout" \
            archlinux:latest \
            bash -ec '
              set -euo pipefail
              pacman-key --init
              pacman-key --populate archlinux
              pacman -Syu --noconfirm
              pacman -S --noconfirm --needed base-devel git gtk4 libadwaita rust sudo
              useradd -m builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
              install -d -o builder -g builder /build
              cp /src/packaging/aur/PKGBUILD /build/PKGBUILD
              cd /build
              # Drop host CARGO_TARGET_DIR so ./target/release/walltag exists for package().
              sudo -u builder env -u CARGO_TARGET_DIR makepkg -s --noconfirm
              cp -v /build/*.pkg.tar.zst /pkgout/
            '
          ls -la pkgout

      - name: Publish gh-pages pacman repo
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$work/pages"
          else
            mkdir -p "$work/pages"
            git -C "$work/pages" init
            git -C "$work/pages" checkout -b gh-pages
            git -C "$work/pages" remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

          mkdir -p "$work/pages/x86_64"
          cp -f pkgout/*.pkg.tar.zst "$work/pages/x86_64/"
          cp -f packaging/pacman/walltag.conf "$work/pages/walltag.conf"
          cp -f packaging/pacman/index.html "$work/pages/index.html"

          (
            cd "$work/pages/x86_64"
            # repo-add lives in pacman; use Arch container again
            docker run --rm -v "$PWD:/repo" archlinux:latest bash -ec '
              pacman -Syu --noconfirm
              pacman -S --noconfirm --needed pacman-contrib
              cd /repo
              repo-add -n -R walltag.db.tar.zst ./*.pkg.tar.zst
            '
          )

          cd "$work/pages"
          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages already up to date"
          else
            git commit -m "pacman: publish ${TAG}"
            git push -u origin gh-pages
          fi

      - name: Enable GitHub Pages from gh-pages
        continue-on-error: true
        run: |
          set -euo pipefail
          # Create or update Pages config to serve gh-pages at the site root.
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
              -f build_type=legacy \
              -f source[branch]=gh-pages \
              -f source[path]=/ || true
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" \
              -f build_type=legacy \
              -f source[branch]=gh-pages \
              -f source[path]=/ || true
          fi

      - name: Upload package to GitHub Release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG not found yet; skipping asset upload."
            exit 0
          fi
          gh release upload "$TAG" pkgout/*.pkg.tar.zst --clobber

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: walltag-arch-x86_64
          path: pkgout/*.pkg.tar.zst
          if-no-files-found: error
